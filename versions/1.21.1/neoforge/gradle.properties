# FalloutCraft for NeoForge, Minecraft 1.21.1. The mod's code is shared with every other build
# (../../../fabric/src, made into this build's sources by ../../../gradle/preprocess.gradle); this
# project only adds NeoForge's entry point and glue (src/main/java/dev/skycraft/neoforge).
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Off: the shared-sources task is a script task.
org.gradle.configuration-cache=false

minecraft_version=1.21.1
# NeoForge: https://projects.neoforged.net/neoforged/neoforge (any 21.1.x)
neo_version=21.1.252

# The mod's version comes from ../../../fabric/gradle.properties (one version for every build).
